name: Deploy to GitHub Pages

# Builds the site and publishes it to the gh-pages branch, which GitHub Pages serves
# (Settings → Pages → Source: Deploy from a branch → gh-pages, / (root)).
# This replaces the actions/deploy-pages step, which kept timing out on GitHub's side.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      # Without this, Pages would run the site through Jekyll and drop the _next folder.
      - run: touch out/.nojekyll
      - name: Publish to gh-pages
        working-directory: out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
